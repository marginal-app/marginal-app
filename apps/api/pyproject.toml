[project]
name = "api"
version = "0.1.0"
description = "Django API for the marginal-app highlighter monorepo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
]

[tool.pyrefly]
python-version = "3.13"
python-interpreter-path = ".venv/bin/python"
search-path = ["."]
project-includes = ["**/*.py"]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
]
