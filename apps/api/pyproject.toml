[project]
name = "api"
version = "0.1.0"
description = "Django API for the marginal-app highlighter monorepo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-components>=0.152.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "playwright>=1.62.0",
    "pyrefly>=1.2.0",
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pyrefly]
python-version = "3.13"
python-interpreter-path = ".venv/bin/python"
search-path = ["."]
project-includes = ["**/*.py"]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
]
