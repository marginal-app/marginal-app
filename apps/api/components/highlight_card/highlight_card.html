<li id="highlight-{{ highlight_id }}" class="highlight-item">
  <div class="highlight-accent" style="background-color: {{ color }}"></div>
  <div class="highlight-body">
    <p class="quote">{{ quote }}</p>
    {% if editing %}
      <form
        class="comment-edit"
        method="post"
        action="{{ comment_save_url }}"
        {% if comment_save_url %}
        hx-post="{{ comment_save_url }}"
        hx-target="closest .highlight-item"
        hx-swap="outerHTML"
        {% endif %}
      >
        {% csrf_token %}
        <textarea name="comment" autofocus>{{ comment }}</textarea>
        <button type="submit" class="primary-button small">저장</button>
      </form>
    {% elif comment_edit_url %}
      <button
        type="button"
        class="comment-trigger"
        hx-get="{{ comment_edit_url }}"
        hx-target="closest .highlight-item"
        hx-swap="outerHTML"
      >
        {% if comment %}
          {{ comment }}
        {% else %}
          <span class="placeholder">코멘트 추가...</span>
        {% endif %}
      </button>
    {% else %}
      <p class="comment-trigger">
        {% if comment %}
          {{ comment }}
        {% else %}
          <span class="placeholder">코멘트 추가...</span>
        {% endif %}
      </p>
    {% endif %}
  </div>
</li>
