{% if is_link %}
<a
  class="{{ class_name }}"
  href="{{ href }}"
  aria-label="{{ label }}"
  title="{{ title }}"
  {% for name, value in attrs.items %}{{ name }}="{{ value }}" {% endfor %}
><span class="ds-icon-button__glyph" aria-hidden="true">{{ icon }}</span></a>
{% else %}
<button
  type="button"
  class="{{ class_name }}"
  aria-label="{{ label }}"
  title="{{ title }}"
  {% for name, value in attrs.items %}{{ name }}="{{ value }}" {% endfor %}
><span class="ds-icon-button__glyph" aria-hidden="true">{{ icon }}</span></button>
{% endif %}
