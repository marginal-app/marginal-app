{% extends "ui/base.html" %}

{% block title %}Library{% endblock %}

{% block extra_head %}
<style>
  body { background: #d8d8dc; }
  .library-page { padding: 2rem 1rem; }
  .library-page > p {
    width: 360px;
    margin: 0 auto 0.75rem;
    font-size: 0.75rem;
    color: #6b6b6b;
  }
  .library-page > p a { color: #5b5bd6; }
</style>
{% endblock %}

{% block body %}
<div class="library-page">
  <p>
    Live HTMX composition —
    <a href="{% url 'component_gallery' %}">gallery</a>
  </p>
  <div class="silhouette">
    <c-library_panel
      c-view="panel_kwargs['view']"
      c-highlights="panel_kwargs['highlights']"
      c-toggle_url="panel_kwargs['toggle_url']"
      c-settings_action_url="panel_kwargs['settings_action_url']"
      c-server_url="panel_kwargs['server_url']"
      c-api_token="panel_kwargs['api_token']"
      c-settings_status="panel_kwargs['settings_status']"
      c-settings_error="panel_kwargs['settings_error']"
      c-csrf_token="panel_kwargs['csrf_token']"
    />
  </div>
</div>
{% endblock %}
