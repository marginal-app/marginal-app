{% extends "ui/base.html" %}

{% block title %}{{ example.title }}{% endblock %}

{% block extra_head %}
<style>
  body {
    min-height: 100vh;
    background: #d8d8dc;
  }
  .silhouette-page {
    padding: 2rem 1rem 3rem;
  }
  .silhouette-meta {
    width: 360px;
    margin: 0 auto 0.75rem;
  }
  .silhouette-meta h1 {
    margin: 0;
    font-size: 0.9rem;
  }
  .silhouette-meta p {
    margin: 0.25rem 0 0;
    font-size: 0.75rem;
    color: #6b6b6b;
  }
  .silhouette-meta a { color: #5b5bd6; font-size: 0.75rem; }
</style>
{% endblock %}

{% block body %}
<div class="silhouette-page">
  <div class="silhouette-meta">
    <h1>{{ example.title }}</h1>
    <p>{{ example.description }}</p>
    <p><a href="{% url 'component_gallery' %}">← gallery</a></p>
  </div>
  <div
    class="silhouette{% if example.is_atom %} silhouette-atom{% endif %}"
    data-example="{{ example.slug }}"
  >
    {{ example.html|safe }}
  </div>
</div>
{% endblock %}
